<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNO Multiplayer Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>UNO <span>UNO</span></h1>
      <h2>MULTIPLAYER LOUNGE</h2>

      <form id="joinForm">
        <label for="username">PLAYER NAME</label>
        <input type="text" id="username" placeholder="Enter name" required>

        <label for="room">ROOM CODE</label>
        <input type="text" id="room" placeholder="Enter room code" required>

        <button type="submit" id="joinBtn">Join Room</button>
      </form>
    </div>
  </div>

  <!-- Socket.io library MUST be loaded before client.js -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
